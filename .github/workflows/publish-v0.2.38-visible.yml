name: Publish v0.2.38 observable

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    if: github.head_ref == 'release/v0.2.38'
    name: Release package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: package:mac
          - platform: Windows
            os: windows-latest
            script: package:win
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node -e "const p=require('./packages/desktop/package.json'); if(p.version!=='0.2.38') process.exit(1)"
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @grok-build/desktop build
      - name: Require macOS signing credentials
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Missing MAC_CSC_LINK or MAC_CSC_KEY_PASSWORD"
            exit 1
          fi
      - name: Package release assets
        run: pnpm --filter @grok-build/desktop ${{ matrix.script }} -- --publish never
        env:
          GROK_DESKTOP_REQUIRE_SIGNING: ${{ matrix.platform == 'macOS' && '1' || '0' }}
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-v0.2.38
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    if: github.head_ref == 'release/v0.2.38'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.38 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          tag_name: v0.2.38
          target_commitish: 7b8b45c6f23acb07b2bd267c146e24c8af5a5798
          name: Grok Build Desktop v0.2.38
          generate_release_notes: true
          files: release-assets/**/*
