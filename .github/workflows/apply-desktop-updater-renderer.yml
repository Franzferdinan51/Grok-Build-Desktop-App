name: Apply desktop updater renderer patch

on:
  push:
    branches: [feat/desktop-github-updater]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-github-updater
      - name: Patch preload and settings integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          preload = Path("packages/desktop/src/preload/index.ts")
          text = preload.read_text()
          text = replace_once(
              text,
              'export type GrokBuildUpdateStatus = { currentVersion: string; latestVersion: string; updateAvailable: boolean; channel: "stable" | "alpha"; error?: string | null }\n',
              '''export type GrokBuildUpdateStatus = { currentVersion: string; latestVersion: string; updateAvailable: boolean; channel: "stable" | "alpha"; error?: string | null }\nexport type DesktopUpdatePhase = "idle" | "checking" | "available" | "downloading" | "ready" | "up-to-date" | "unsupported" | "error"\nexport type DesktopUpdateState = { phase: DesktopUpdatePhase; currentVersion: string; availableVersion?: string; releaseName?: string; releaseNotes?: string; percent?: number; transferred?: number; total?: number; bytesPerSecond?: number; checkedAt?: number; error?: string }\n''',
              "preload desktop types",
          )
          text = replace_once(
              text,
              '  app: { openExternal: (url: string) => Promise<void>; getVersion: () => Promise<string>; backendRepository: () => Promise<string>; restart: () => Promise<{ ok: boolean }>; notify: (input: { kind: "success" | "error"; title: string; body: string }) => Promise<{ shown: boolean }> }\n',
              '''  app: {\n    openExternal: (url: string) => Promise<void>\n    getVersion: () => Promise<string>\n    backendRepository: () => Promise<string>\n    restart: () => Promise<{ ok: boolean }>\n    notify: (input: { kind: "success" | "error"; title: string; body: string }) => Promise<{ shown: boolean }>\n    desktopUpdateState: () => Promise<DesktopUpdateState>\n    checkDesktopUpdate: () => Promise<DesktopUpdateState>\n    downloadDesktopUpdate: () => Promise<DesktopUpdateState>\n    installDesktopUpdate: () => Promise<{ ok: true }>\n    onDesktopUpdateState: (handler: (state: DesktopUpdateState) => void) => () => void\n  }\n''',
              "preload app api type",
          )
          text = replace_once(
              text,
              '  app: { openExternal: (url) => ipcRenderer.invoke("app:open-external", url), getVersion: () => ipcRenderer.invoke("app:get-version"), backendRepository: () => ipcRenderer.invoke("app:backend-repository"), restart: () => ipcRenderer.invoke("app:restart"), notify: (input) => ipcRenderer.invoke("app:notify", input) },\n',
              '''  app: {\n    openExternal: (url) => ipcRenderer.invoke("app:open-external", url),\n    getVersion: () => ipcRenderer.invoke("app:get-version"),\n    backendRepository: () => ipcRenderer.invoke("app:backend-repository"),\n    restart: () => ipcRenderer.invoke("app:restart"),\n    notify: (input) => ipcRenderer.invoke("app:notify", input),\n    desktopUpdateState: () => ipcRenderer.invoke("desktop-update:state"),\n    checkDesktopUpdate: () => ipcRenderer.invoke("desktop-update:check"),\n    downloadDesktopUpdate: () => ipcRenderer.invoke("desktop-update:download"),\n    installDesktopUpdate: () => ipcRenderer.invoke("desktop-update:install"),\n    onDesktopUpdateState: (handler) => {\n      const listener = (_event: IpcRendererEvent, state: DesktopUpdateState) => handler(state)\n      ipcRenderer.on("desktop-update:changed", listener)\n      return () => ipcRenderer.removeListener("desktop-update:changed", listener)\n    },\n  },\n''',
              "preload app api implementation",
          )
          preload.write_text(text)

          settings = Path("packages/desktop/src/renderer/views/SettingsPanel.tsx")
          text = settings.read_text()
          text = replace_once(
              text,
              'import { ModelPicker } from "../ModelPicker"\n',
              'import { ModelPicker } from "../ModelPicker"\nimport { DesktopUpdateCard } from "../DesktopUpdateCard"\n',
              "settings desktop card import",
          )
          text = replace_once(
              text,
              '''        </div>\n      </Show>\n    </Show>\n\n    <Show when={props.tab === "accounts"}>\n''',
              '''        </div>\n      </Show>\n\n      <Show when={showCard("Grok Build Desktop updates", "desktop app github releases update download install restart")}>\n        <DesktopUpdateCard />\n      </Show>\n    </Show>\n\n    <Show when={props.tab === "accounts"}>\n''',
              "settings desktop card placement",
          )
          settings.write_text(text)
      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-desktop-updater-renderer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/src/preload/index.ts packages/desktop/src/renderer/views/SettingsPanel.tsx .github/workflows/apply-desktop-updater-renderer.yml
          git commit -m "feat: expose desktop updater in settings"
          git push origin HEAD:feat/desktop-github-updater
