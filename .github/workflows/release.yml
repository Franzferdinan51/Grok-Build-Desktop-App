name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: package:mac
          - platform: Windows
            os: windows-latest
            script: package:win
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const p=require('./packages/desktop/package.json'); const expected='v'+p.version; if(process.env.GITHUB_REF_NAME!==expected){ console.error('Release tag '+process.env.GITHUB_REF_NAME+' does not match desktop version '+expected); process.exit(1) }"

      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @grok-build/desktop build

      # macOS auto-update refuses unsigned applications. A tagged release must
      # therefore fail rather than quietly publishing a build that cannot update.
      - name: Require macOS release signing credentials
        if: matrix.platform == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Missing MAC_CSC_LINK or MAC_CSC_KEY_PASSWORD; refusing to publish a non-updatable macOS release."
            exit 1
          fi

      # Build the installer and its update metadata together, but do not let the
      # matrix jobs race each other while creating/updating a GitHub Release.
      - name: Package desktop update assets
        run: pnpm --filter @grok-build/desktop ${{ matrix.script }} -- --publish never
        env:
          GROK_DESKTOP_REQUIRE_SIGNING: ${{ matrix.platform == 'macOS' && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: grok-build-desktop-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Publish only after both platform jobs succeeded, so the public release
      # always contains the installers and the exact metadata generated with them.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
