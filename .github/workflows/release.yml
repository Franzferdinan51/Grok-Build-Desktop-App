name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: package:mac
            artifact: packages/desktop/dist/*
          - platform: Windows
            os: windows-latest
            script: package:win
            artifact: packages/desktop/dist/*
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Hosted runners do not provide the locally installed Grok CLI or the
      # same filesystem error semantics as the desktop development machine.
      - run: pnpm test:unit
      - run: pnpm --filter @grok-build/desktop ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: grok-build-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
