<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Dark background -->
  <rect width="1280" height="800" fill="#0d0d0f"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#111116"/>
  <rect x="239" y="0" width="1" height="800" fill="#1e1e26"/>

  <!-- Sidebar header -->
  <rect x="0" y="0" width="240" height="52" fill="#111116"/>
  <rect x="0" y="51" width="240" height="1" fill="#1e1e26"/>
  <text x="16" y="32" font-family="sans-serif" font-size="15" font-weight="600" fill="#e8e8f0">Grok Build</text>
  <rect x="212" y="18" width="18" height="18" rx="4" fill="#18181e"/>

  <!-- Sidebar nav items -->
  <rect x="6" y="64" width="228" height="28" rx="6" fill="#1e1e26"/>
  <text x="22" y="81" font-family="sans-serif" font-size="13" fill="#e8e8f0">✏️ New task</text>

  <rect x="6" y="96" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="113" font-family="sans-serif" font-size="13" fill="#8888a0">🔍 Search</text>

  <rect x="6" y="128" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="145" font-family="sans-serif" font-size="13" fill="#8888a0">🛠️ Skills</text>

  <rect x="6" y="160" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="177" font-family="sans-serif" font-size="13" fill="#8888a0">📅 Scheduled</text>

  <!-- Mobile section -->
  <text x="16" y="216" font-family="sans-serif" font-size="11" font-weight="600" fill="#55556a" text-transform="uppercase" letter-spacing="0.06em">MOBILE</text>
  <rect x="6" y="224" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="241" font-family="sans-serif" font-size="13" fill="#8888a0">📱 Mobile session</text>

  <!-- Pinned section -->
  <text x="16" y="280" font-family="sans-serif" font-size="11" font-weight="600" fill="#55556a">PINNED</text>
  <rect x="6" y="288" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="305" font-family="sans-serif" font-size="13" fill="#8888a0">📌 grok-build integration</text>
  <rect x="6" y="320" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="337" font-family="sans-serif" font-size="13" fill="#8888a0">📌 lm-studio setup</text>

  <!-- Projects section -->
  <text x="16" y="376" font-family="sans-serif" font-size="11" font-weight="600" fill="#55556a">PROJECTS</text>
  <rect x="6" y="384" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="401" font-family="sans-serif" font-size="13" fill="#8888a0">📁 Grok-Build-Desktop-App</text>
  <rect x="6" y="416" width="228" height="28" rx="6" fill="transparent"/>
  <text x="22" y="433" font-family="sans-serif" font-size="13" fill="#8888a0">📁 my-other-project</text>

  <!-- Plus Plan footer -->
  <rect x="6" y="700" width="228" height="68" rx="10" fill="#18181e"/>
  <rect x="6" y="700" width="228" height="68" rx="10" stroke="#2a2a36" stroke-width="1" fill="none"/>
  <text x="28" y="728" font-size="18">⭐</text>
  <text x="52" y="726" font-family="sans-serif" font-size="12" font-weight="600" fill="#e8e8f0">Plus Plan</text>
  <text x="52" y="740" font-family="sans-serif" font-size="11" fill="#55556a">Unlimited Grok sessions</text>
  <rect x="158" y="718" width="60" height="24" rx="6" fill="#6b8aff"/>
  <text x="173" y="734" font-family="sans-serif" font-size="12" font-weight="600" fill="white">Upgrade</text>

  <!-- Grok status -->
  <circle cx="20" cy="774" r="4" fill="#4ade80"/>
  <text x="34" y="778" font-family="sans-serif" font-size="12" fill="#4ade80">Grok Online</text>

  <!-- Main content area -->
  <!-- Centered empty state -->
  <text x="640" y="280" font-family="sans-serif" font-size="56" text-anchor="middle" fill="#e8e8f0">🤖</text>
  <text x="640" y="340" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#e8e8f0">What would you like to build?</text>
  <text x="640" y="370" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#8888a0">Ask Grok to code, debug, or explore your codebase</text>

  <!-- Model picker -->
  <rect x="400" y="410" width="480" height="120" rx="10" fill="#111116" stroke="#2a2a36" stroke-width="1"/>
  <text x="416" y="432" font-family="sans-serif" font-size="12" font-weight="600" fill="#55556a">PROVIDER</text>

  <!-- Provider buttons (2x2 grid) -->
  <rect x="416" y="442" width="110" height="36" rx="8" fill="#1e1e26" stroke="#6b8aff" stroke-width="1"/>
  <text x="426" y="458" font-size="14">🤖</text>
  <text x="448" y="462" font-family="sans-serif" font-size="13" font-weight="500" fill="#6b8aff">Grok</text>

  <rect x="534" y="442" width="110" height="36" rx="8" fill="#18181e" stroke="#2a2a36"/>
  <text x="544" y="458" font-size="14">💻</text>
  <text x="566" y="462" font-family="sans-serif" font-size="13" fill="#8888a0">LM Studio</text>

  <rect x="652" y="442" width="110" height="36" rx="8" fill="#18181e" stroke="#2a2a36"/>
  <text x="662" y="458" font-size="14">⚡</text>
  <text x="684" y="462" font-family="sans-serif" font-size="13" fill="#8888a0">Codex</text>

  <rect x="770" y="442" width="110" height="36" rx="8" fill="#18181e" stroke="#2a2a36"/>
  <text x="780" y="458" font-size="14">🌐</text>
  <text x="802" y="462" font-family="sans-serif" font-size="13" fill="#8888a0">GPT-4o</text>

  <!-- Toggles -->
  <rect x="416" y="494" width="140" height="20" rx="10" fill="#18181e" stroke="#2a2a36"/>
  <rect x="420" y="496" width="14" height="14" rx="7" fill="#55556a"/>
  <text x="440" y="507" font-family="sans-serif" font-size="13" fill="#8888a0">Thinking</text>

  <rect x="572" y="494" width="170" height="20" rx="10" fill="#18181e" stroke="#2a2a36"/>
  <rect x="576" y="496" width="14" height="14" rx="7" fill="#55556a"/>
  <text x="596" y="507" font-family="sans-serif" font-size="13" fill="#8888a0">Full Authorization</text>

  <!-- File attachers -->
  <rect x="416" y="548" width="70" height="56" rx="8" fill="#111116" stroke="#2a2a36"/>
  <text x="451" y="570" font-size="18" text-anchor="middle">📊</text>
  <text x="451" y="590" font-family="sans-serif" font-size="12" fill="#8888a0" text-anchor="middle">Slides</text>

  <rect x="494" y="548" width="70" height="56" rx="8" fill="#111116" stroke="#2a2a36"/>
  <text x="529" y="570" font-size="18" text-anchor="middle">📄</text>
  <text x="529" y="590" font-family="sans-serif" font-size="12" fill="#8888a0" text-anchor="middle">PDF</text>

  <rect x="572" y="548" width="70" height="56" rx="8" fill="#111116" stroke="#2a2a36"/>
  <text x="607" y="570" font-size="18" text-anchor="middle">📝</text>
  <text x="607" y="590" font-family="sans-serif" font-size="12" fill="#8888a0" text-anchor="middle">Docs</text>

  <rect x="650" y="548" width="70" height="56" rx="8" fill="#111116" stroke="#2a2a36"/>
  <text x="685" y="570" font-size="18" text-anchor="middle">📋</text>
  <text x="685" y="590" font-family="sans-serif" font-size="12" fill="#8888a0" text-anchor="middle">Excel</text>

  <!-- Text area -->
  <rect x="400" y="624" width="480" height="80" rx="10" fill="#111116" stroke="#2a2a36"/>
  <text x="416" y="655" font-family="sans-serif" font-size="14" fill="#55556a">Describe a task, paste code, or ask a question...</text>

  <!-- Send button -->
  <rect x="808" y="672" width="72" height="32" rx="8" fill="#6b8aff"/>
  <text x="844" y="692" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Send</text>
</svg>
